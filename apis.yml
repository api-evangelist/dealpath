name: Dealpath
description: >-
  Dealpath is an AI-powered deal management platform for commercial real estate
  investing, used by 300+ institutional firms to centralize deal data, automate
  workflows, and surface analytics across the full investment lifecycle from
  sourcing and pipeline management through underwriting, due diligence, IC
  approval, close, and portfolio insights. Its product areas include market
  tracking and comps, Dealpath Connect deal sourcing, pipeline visibility, deal
  execution, reporting dashboards, relationship/CRM management, and Dealpath AI.
  Dealpath exposes a bearer-token REST API at api.dealpath.com (documented on
  Stoplight) so customers can programmatically feed opportunities into their
  pipeline and establish bidirectional data flows with other business systems.
